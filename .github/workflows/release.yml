# 버전 태그가 올라오면 OS 3종 패키지와 체크섬을 붙인 GitHub Release 를 발행한다 (UND-64).
#
# 이 YAML 에는 **배선만** 둔다 — 태그↔버전 대조 · 자산명 산출 · 체크섬 산출/검증 · 멱등 발행은
# packaging/*.sh 에 있고 Kotest 가 실제로 실행해 검증한다. YAML 안의 분기는 태그를 밀어야만
# 돌아서 검증 밖으로 나간다.
#
# 발행 계약의 정본은 packaging/RELEASE-CONTRACT.md 다 — UND-48(자동 업데이트)이 코드로 읽는다.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# 같은 태그의 실행이 겹치면 릴리즈 자산을 서로 덮는다. 앞선 실행을 취소하지는 않는다 —
# 발행 도중 끊기면 반쪽 릴리즈가 남는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # jpackage 는 크로스 빌드를 하지 않는다 — 각 OS 러너가 자기 포맷만 만든다.
  package:
    strategy:
      # 하나라도 실패하면 나머지를 계속 돌리지 않는다. 어차피 발행하지 않는다.
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest
            os: macos
          - runner: windows-latest
            os: windows
          - runner: ubuntu-latest
            os: linux
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Windows 러너도 같은 셸 스크립트를 쓴다 — 계약 판단이 OS 마다 갈리지 않게.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # JDK 핀을 gradle.properties 에서 읽는다 — 워크플로우에 숫자를 쓰지 않는다.
      - name: Resolve JDK version
        id: jdk
        run: echo "version=$(grep -E '^undine\.jvm=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - uses: gradle/actions/setup-gradle@v4

      # 태그와 undine.version 이 어긋나면 여기서 끝난다 — 빌드 비용을 쓰기 전에 멈춘다.
      - name: Check tag against undine.version
        run: bash packaging/release-assets.sh check-tag "${{ github.ref_name }}"

      - name: Package for current OS
        run: ./gradlew packageDistributionForCurrentOS --no-daemon --stacktrace

      # 실패하면 jpackage 는 이유를 **자기 로그 파일에만** 쓴다 — Gradle 은 그 파일 경로만 남기고,
      # 파일은 러너와 함께 사라진다. v1.0.0 이 `:app:packageMsi FAILED` 한 줄만 남기고 죽어
      # 원인(WiX light.exe 의 LGHT0311)을 볼 수 없었다. 그래서 꺼내 둔다.
      #
      # 로그에 찍고 아티팩트로도 올린다 — 찍은 것은 로그 보존 기간이 지나면 사라지고,
      # 아티팩트는 한 파일로 내려받아 볼 수 있다.
      - name: Dump jpackage logs on failure
        if: failure()
        run: |
          find app/build/compose/logs -type f 2>/dev/null || echo "(jpackage 로그가 없습니다)"
          echo
          for log in $(find app/build/compose/logs -type f -name '*.txt' 2>/dev/null); do
            echo "===== $log ====="
            cat "$log"
            echo
          done

      - name: Upload jpackage logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-logs-${{ matrix.os }}
          path: app/build/compose/logs/
          if-no-files-found: warn

      - name: Stage asset under contract name
        run: bash packaging/release-assets.sh stage "${{ matrix.os }}" app/build/compose/binaries/main staged

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: staged/
          if-no-files-found: error

  # needs 가 게이트다 — 세 잡이 모두 성공해야 이 잡이 시작한다. 하나라도 실패하면
  # 릴리즈 자체가 만들어지지 않으므로 반쪽 릴리즈가 남지 않는다.
  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: staged

      # 체크섬 산출·검증과 멱등 발행(같은 태그로 재실행해도 릴리즈는 하나)은 스크립트 안에 있다.
      - name: Publish release
        env:
          # 조회 좌표를 박지 않는다 — gh 가 실행 컨텍스트의 저장소를 스스로 안다.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packaging/publish-release.sh "${{ github.ref_name }}" staged
