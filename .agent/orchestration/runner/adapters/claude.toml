# 벤더 어댑터 — Anthropic Claude Code CLI (헤드리스 `claude -p`)
#
# 스키마 정의와 새 벤더 추가 절차: adapters/README.md
# 러너 코드에는 벤더 분기가 없다 — 이 파일이 CLI 조립 규칙의 유일한 정의다.

id = "claude"
description = "Claude Code CLI — 헤드리스 실행. 프로젝트 MCP 를 붙일 수 있는 유일한 벤더."

# 항상 붙는 고정 인자.
base = ["claude", "-p", "--output-format", "json"]

# 프롬프트 전달 방식: stdin (표준입력) | argv (마지막 인자)
prompt_delivery = "stdin"

# 결과 회수 방식: stdout_envelope (stdout 의 JSON 봉투에서 꺼냄) | out_file (CLI 가 파일에 씀)
result = "stdout_envelope"
envelope_result_key = "result"
envelope_cost_key = "total_cost_usd"

# 노드가 값을 주지 않았을 때 적용할 기본값.
# 읽기 전용 노드는 dontAsk 로 충분하다. 파일을 쓰는 노드는 워크플로우에서 acceptEdits 등을
# 명시한다 (헤드리스에는 승인을 누를 사람이 없다). 어느 모드에서도 훅 가드는 그대로 적용된다.
[defaults]
permission_mode = "dontAsk"

# 노드 키 → argv 조각. 노드에 값이 있을 때만 붙는다.
# 자리표시자: {value} 원값 · {csv} 리스트를 쉼표로 연결 · {repo_path} 레포 루트 기준 경로(존재 검증)
[flags]
model = ["--model", "{value}"]
effort = ["--effort", "{value}"]
permission_mode = ["--permission-mode", "{value}"]
tools = ["--allowedTools", "{csv}"]
# MCP 는 claude 노드만 붙일 수 있다 (codex 는 개인 설정에 별도 등록해야 하고 claude.ai
# connector 계열은 아예 없다). MCP 가 필요한 단계는 claude 노드로 잡고 결과를 파일로 넘긴다.
mcp_config = ["--mcp-config", "{repo_path}", "--strict-mcp-config"]

# ── 벤더 소진 시 failover ──
# 이 벤더가 소진되면 fallback_to 벤더로 **1회만** 재시도한다 (노드당 1 hop — 무한 순환 방지).
# 러너는 여기 선언만 보고 동작한다. 벤더 분기 코드는 여전히 없다.
[failover]
fallback_to = "codex"
# 대체 벤더의 모델 id. 노드의 model("opus" 등)은 이 벤더 전용이라 그대로 넘길 수 없다.
fallback_model = "gpt-5.6-terra"
# stdout+stderr 에 대해 대소문자 무시로 검사한다.
# 주의: 일시적 rate limit 도 여기에 걸린다 — 기다리는 대신 벤더를 바꾸는 선택이다.
exhaustion_patterns = [
  "usage limit reached",
  "rate.?limit",
  "credit balance is too low",
  "insufficient credits",
  "\"status\"\\s*:\\s*429",
  "429 too many requests",
  # 2026-08-21 UND-13~22 관측 봉투: 세션 한도는 키가 api_error_status 라 위의 "status":429 가
  # 앞의 " 리터럴 때문에 못 잡고, 문구도 "You've hit your session limit" 이라 usage limit reached 와 다르다.
  # 이 두 줄이 없으면 9개 노드가 11분씩 태우고 codex 재시도 없이 전멸한다.
  "\"api_error_status\"\\s*:\\s*429",
  "hit your (session|usage) limit",
]

# 벤더 전환 시 안전 의미를 잃지 않도록 키·값을 명시 변환한다.
# 여기 없는 미지원 키는 제거되며, 제거 사실은 로그와 run.json 에 남는다.
[failover.translate.permission_mode]
dontAsk = { key = "sandbox", value = "read-only" }
acceptEdits = { key = "sandbox", value = "workspace-write" }
