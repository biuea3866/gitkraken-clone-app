name = "develop-2-implement"
description = """
개발 루프 2단계 — 구현 → 1차 5축 병렬 검증 → 요약 (custom-develop-orchestrator ④ + custom-self-code-review).
게이트 ③(스펙 승인)을 통과한 뒤 실행한다.

노드 배치:
  wave 1 (1)  implement_1                                    claude/opus  · workspace-write
  wave 2 (5)  intent_ac_1 tests_1 side_effects_1 deploy_1 rollback_1   codex/terra · read-only
  wave 3 (1)  review_summary_1                               codex/terra  · read-only

쓰기 노드는 wave 1 에 단독이다 (한 파일 = 한 writer). 5축은 서로 독립이라 병렬로 돈다.

실행 후 **메인 Claude 가 `review_summary_1.json` 의 verdict 를 읽어 후속 워크플로우를 고른다**
(러너에는 조건부 분기가 없다):
  REQUEST_CHANGES        → develop-3-repair.toml
  APPROVED · COMMENT     → develop-3-approve.toml
산출물이 없거나 verdict 를 읽을 수 없으면 **REQUEST_CHANGES 로 취급**한다 (fail-closed).

사용법:
  .agent/orchestration/runner/run-graph.py .agent/orchestration/workflows/develop-2-implement.toml \\
    --run-dir .agent/orchestration/runs/UND-14 \\
    --set ticket=UND-14 \\
    --set spec_file=.agent/orchestration/runs/UND-14/spec.json \\
    --max-parallel 5
"""
cwd = "."

# ── wave 1 ── 코드 작성. 판단·설계 비중이 크므로 claude/opus.
[[nodes]]
id = "implement_1"
vendor = "claude"
model = "opus"
tools = ["Read", "Write", "Edit", "Bash", "Grep", "Glob"]
# 헤드리스라 승인을 누를 사람이 없다. 편집이 거부되면 bypassPermissions 로 올린다 —
# 어느 모드에서도 .agent/hooks 가드(시크릿·push·mainline·JDK)는 그대로 적용된다.
permission_mode = "acceptEdits"
timeout_seconds = 3600
prompt = '''
티켓 {{ticket}} 을 구현하세요. **코드 작성 작업입니다.**

입력:
- 스펙: {{spec_file}}
- **결정 문서: {{decisions_file}}** — 스펙의 `open_questions` 에 대한 사람의 답이다.
  `open_questions` 가 비어 있지 않아도 **이 문서가 그 질문에 답하고 있으면 구현을 진행한다.**
  문서가 답하지 않은 질문만 `blocked_by_open_questions` 로 멈춘다.
  값이 `없음` 이면 결정 문서가 없다는 뜻이므로 기존 규칙대로 `open_questions` 가 비어야 진행한다. — 먼저 읽고, 인수 조건과 테스트 계획을 그대로 목표로 삼으세요.
- 코드 규칙: .agent/rules/ — 다루는 파일 종류에 해당하는 규칙을 읽고 따릅니다.
- 모듈 스택 핀: 각 모듈 CLAUDE.md — 요구 JVM 이 모듈마다 다릅니다.

절차:
1. 스펙의 open_questions 가 비어 있지 않으면 **구현하지 말고** 즉시 JSON 으로 보고하며 멈춥니다
   (사람 판단이 필요한 항목이 남아 있다는 뜻입니다).
2. 테스트를 먼저 작성합니다 (RED). 프레임워크는 모듈의 인접 테스트 코드를 따릅니다.
3. 구현해서 통과시킵니다 (GREEN).
4. 모듈 디렉토리로 이동해 빌드/테스트를 돌립니다. 루트에는 통합 wrapper 가 없습니다.
   `export JAVA_HOME=$(/usr/libexec/java_home -v <모듈 요구 버전>)` 을 먼저 하세요 —
   맞지 않으면 훅이 ./gradlew 실행을 차단합니다.
5. 실패하면 사람에게 묻지 말고 스스로 고쳐 **통과할 때까지 반복**합니다.
6. **커밋하지 않습니다.** 변경은 워킹트리에 남겨 두세요 — 커밋·PR 은 최종 게이트 이후 사람이 합니다.
7. `git push` · mainline 머지 · 시크릿 파일 편집은 금지입니다 (훅이 차단하며, 우회하지 마세요).

최종 응답은 다음 JSON 객체 하나만 출력하세요:
{
  "ticket": "{{ticket}}",
  "status": "implemented" | "blocked_by_open_questions",
  "files_changed": ["경로", ...],
  "tests_added": ["테스트 클래스/메서드", ...],
  "build": [{"module": "app", "command": "./gradlew test", "result": "pass" | "fail", "note": "..."}],
  "deviations": ["스펙과 다르게 구현한 점과 이유", ...],
  "summary_ko": "한 문장 요약"
}
'''

# ── wave 2 ── 1차 5축 병렬 검증. 전부 읽기 전용 codex/terra.
#
# 각 노드에 custom-self-code-review 스킬을 role_file 로 주입한다 — 축 정의의 SSOT 가 그 파일 하나이므로
# 대화형 자가 리뷰와 무인 검증이 같은 기준을 쓴다. 노드는 **자기 축만** 판정한다 (중복 집계 방지).
#
# 주의: 스킬 본문이 권하는 서브에이전트는 codex 노드에서
# 호출할 수 없다. 해당 점검은 노드가 직접 정적으로 수행한다.

[[nodes]]
id = "intent_ac_1"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["implement_1"]
role_file = ".agent/skills/custom-self-code-review/SKILL.md"
output_schema = ".agent/orchestration/schemas/axis-review.json"
prompt = '''
티켓 {{ticket}} 의 변경을 **축 1 (변경 의도와 티켓 정합성) 만** 검증하세요.
코드를 수정하지 않습니다. axis 는 "intent_ac" 로 고정합니다.

입력:
- 스펙: {{spec_file}} — 인수 조건(acceptance_criteria)의 원본입니다.
- 구현 보고: 업스트림 `implement_1` 산출물 (files_changed · deviations · build).
- 변경 내용: `git status --porcelain` 과 `git diff` 로 직접 확인하세요 (아직 커밋되지 않았습니다).
- 등급 기준: .agent/docs/review-grading.md
- 오탐 기준: .agent/docs/review-false-positives.md — **finding 을 적기 전에 먼저 읽고 대조**하세요.

점검:
1. 스펙의 인수 조건을 항목별로 코드와 대조합니다 (파일:라인 또는 테스트명을 근거로).
2. `implement_1` 의 deviations 가 정당한지, 스펙을 임의로 축소·확대하지 않았는지 봅니다.
3. **스코프 초과 변경** — 티켓과 무관한 리팩터링·포맷 변경이 diff 에 섞였는지 식별합니다.
4. 변경 파일을 전수 읽습니다. 요약·추측으로 판정하지 마세요.

코드-스펙 불일치는 p1 이상입니다 (스펙을 읽은 상태에서 발견한 불일치이므로).
'''

[[nodes]]
id = "tests_1"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["implement_1"]
role_file = ".agent/skills/custom-self-code-review/SKILL.md"
output_schema = ".agent/orchestration/schemas/axis-review.json"
prompt = '''
티켓 {{ticket}} 의 변경을 **축 2 (테스트 커버) 만** 검증하세요.
코드를 수정하지 않습니다. axis 는 "tests" 로 고정합니다.

입력:
- 스펙: {{spec_file}} — test_plan 이 목표입니다.
- 구현 보고: 업스트림 `implement_1` 산출물 (tests_added · build 결과).
- 변경 내용: `git status --porcelain` · `git diff`
- 등급 기준: .agent/docs/review-grading.md · 오탐 기준: .agent/docs/review-false-positives.md (선행 대조)

점검:
1. 신규 클래스/함수에 대응 테스트가 있는지 짝을 맞춥니다 (`*Spec.kt` / `*Test.kt` grep).
2. 버그 수정이면 **재현 테스트**가 추가됐는지 확인합니다 (회귀 방지).
3. 스펙 test_plan 의 실패·엣지 케이스가 실제로 작성됐는지 대조합니다 — 해피 패스만 있으면 p2 입니다.
4. **빌드·테스트가 실제로 실행됐는지** `implement_1` 의 build 배열을 근거로 확인합니다.
   result 가 fail 이거나 배열이 비어 있으면 p2 이상으로 올립니다 ("통과했다"는 서술만으로 인정하지 않습니다).
5. 기존 테스트를 수정했다면 의도가 정당한지 봅니다 (테스트를 약화시켜 통과시킨 흔적이 있는지).

프레임워크·스타일 판정은 모듈의 인접 테스트 코드가 기준입니다 (.agent/rules/testing.md).
'''

[[nodes]]
id = "side_effects_1"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["implement_1"]
role_file = ".agent/skills/custom-self-code-review/SKILL.md"
output_schema = ".agent/orchestration/schemas/axis-review.json"
prompt = '''
티켓 {{ticket}} 의 변경을 **축 3 (사이드 이펙트 — 레이어 경계·호출 그래프·자원 수명) 만** 검증하세요.
코드를 수정하지 않습니다. axis 는 "side_effects" 로 고정합니다.

입력:
- 변경 내용: `git status --porcelain` · `git diff`
- 레이어 규칙: .agent/rules/architecture-layers.md · JGit 규칙: .agent/rules/jgit-usage.md
- 등급 기준: .agent/docs/review-grading.md · 오탐 기준: .agent/docs/review-false-positives.md (선행 대조)

점검 (서브에이전트를 호출할 수 없으므로 **직접 grep 해서** 판정합니다):
1. **1-hop 호출 그래프** — 변경된 public 함수·모델을 심볼로 grep 해 호출자를 찾고,
   시그니처 변경이 호출부를 깨뜨리는지 확인합니다.
2. **레이어 경계** — `domain` 이 다른 레이어(application·infrastructure·presentation)를 import 하는지,
   presentation 이 Gateway 를 직접 주입받는지 봅니다 (둘 다 p1).
   **domain 의 프레임워크 import(JGit·Compose·코루틴)는 허용이므로 지적하지 않습니다.**
3. **interface↔구현 양끝** — `~Gateway.kt` 와 `~GatewayImpl.kt` 중 한쪽만 변경됐으면 비대칭을 지적합니다.
4. **JGit 자원 수명** — `Repository`·`RevWalk`·`TreeWalk`·`ObjectReader`·`DiffFormatter` 가
   `use {}` 없이 열리는지 봅니다 (p1).
5. **스레드 경계** — Git I/O 가 `Dispatchers.IO` 밖에서 실행되는지, `Repository` 동시 접근이
   직렬화되는지 봅니다.

diff 밖 파일을 근거로 단정하지 마세요 — 읽고 확인한 것만 적습니다 (오탐 SSOT A절).
'''

[[nodes]]
id = "deploy_1"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["implement_1"]
role_file = ".agent/skills/custom-self-code-review/SKILL.md"
output_schema = ".agent/orchestration/schemas/axis-review.json"
prompt = '''
티켓 {{ticket}} 의 변경을 **축 4 (빌드·툴체인 의존성) 만** 검증하세요.
코드를 수정하지 않습니다. axis 는 "deploy" 로 고정합니다.

입력:
- 변경 내용: `git status --porcelain` · `git diff`
- 프로세스 게이트: .agent/docs/conventions.md · 버전 카탈로그: gradle/libs.versions.toml
- 등급 기준: .agent/docs/review-grading.md · 오탐 기준: .agent/docs/review-false-positives.md (선행 대조)

점검:
1. **의존성 추가** — 새 라이브러리가 `gradle/libs.versions.toml` 을 경유하는지 봅니다.
   `build.gradle.kts` 에 버전을 하드코딩했으면 p2 입니다.
2. **JDK 툴체인** — `gradle.properties` 의 `undine.jvm` 이 바뀌었다면 훅 가드와 CI 가 함께
   갱신됐는지 확인합니다. 한쪽만 바뀌면 p1 입니다.
3. **패키징 영향** — `compose.desktop.application` 블록(dmg/msi 구성·아이콘·JVM 인자) 변경이
   기존 배포 산출물을 깨뜨리는지 봅니다.
4. **사용자 설정 파일 스키마** — 저장 형식이 바뀌었다면 **구버전 설정 파일을 읽었을 때의 동작**을
   확인합니다. 하위 호환 처리가 없으면 p1 입니다.
5. **테스트 게이트** — 변경 범위에 대응하는 테스트가 실제로 실행되는지 확인하고, 실행 근거
   (`./gradlew test` 출력)를 checked 에 남깁니다.

빌드·툴체인에 영향이 없는 변경이면 근거와 함께 n/a 로 남깁니다.
'''

[[nodes]]
id = "rollback_1"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["implement_1"]
role_file = ".agent/skills/custom-self-code-review/SKILL.md"
output_schema = ".agent/orchestration/schemas/axis-review.json"
prompt = '''
티켓 {{ticket}} 의 변경을 **축 5 (롤백 가능성) 만** 검증하세요.
코드를 수정하지 않습니다. axis 는 "rollback" 로 고정합니다.

입력:
- 변경 내용: `git status --porcelain` · `git diff`
- 프로세스 게이트: .agent/docs/conventions.md (Rule 4 파괴적 변경 명시)
- 등급 기준: .agent/docs/review-grading.md · 오탐 기준: .agent/docs/review-false-positives.md (선행 대조)

점검:
1. **revert 단위** — 티켓 범위 밖 변경이 같은 커밋에 섞여 되돌리기 불가해졌는지 봅니다.
2. **설정 파일 역방향** — 설정 스키마를 바꿨다면 구버전 앱이 신 스키마를 만났을 때
   크래시하는지 봅니다 (p1, 데이터 유실이면 p0).
3. **파괴적 Git 연산** — `reset --hard`·`clean -fd`·force push 가 추가됐다면 사용자 확인 절차와
   되돌리기 경로가 있는지 확인합니다. 없으면 p0 입니다.
4. **사용자 데이터 유실** — 롤백 시 사용자의 stash·설정·자격증명이 해석 불가해지는 경로가 있는지 봅니다.
5. **부분 적용** — 다단계 Git 연산이 중간에 실패했을 때 저장소가 어중간한 상태로 남는지 봅니다.

롤백이 필요 없는 변경(순수 내부 리팩터링 등)이면 근거와 함께 n/a 로 남깁니다.
'''

# ── wave 3 ── 5축 병합 + verdict 확정. 판정 기준이 문서로 고정돼 있어 codex/terra.
[[nodes]]
id = "review_summary_1"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["intent_ac_1", "tests_1", "side_effects_1", "deploy_1", "rollback_1"]
output_schema = ".agent/orchestration/schemas/review.json"
prompt = '''
티켓 {{ticket}} 의 1차 5축 검증 결과를 병합해 **verdict 를 확정**하세요.
코드를 수정하지 않고, 새 축을 발명하지도 않습니다.

입력:
- 5축 산출물: 업스트림 `intent_ac_1` · `tests_1` · `side_effects_1` · `deploy_1` · `rollback_1`
- 스펙: {{spec_file}} — ac_results 의 기준입니다.
- 등급·verdict 규칙: .agent/docs/review-grading.md
- 오탐 기준: .agent/docs/review-false-positives.md

해야 할 일:
1. 5개 산출물의 findings 를 모아 **중복을 제거**합니다 (같은 파일:라인 + 같은 원인은 1건으로,
   가장 높은 레벨을 채택하고 problem 에 어느 축들이 지적했는지 적습니다).
2. `false_positive_checked` 가 false 인 finding 은 **한 단계 강등**합니다 (오탐 대조를 거치지 않았으므로).
   오탐 SSOT 에 해당하는 패턴이면 기각하고 findings 에서 제외합니다.
3. 스펙의 인수 조건별 충족 여부를 ac_results 에 채웁니다 — 근거는 `intent_ac_1` 의 checked 를 씁니다.
4. verdict 를 규칙대로 정합니다: p0~p2 가 하나라도 있으면 REQUEST_CHANGES,
   p3~p4 만 있으면 COMMENT, 없으면 APPROVED.
5. 축 산출물이 누락됐거나 파싱 실패면 **REQUEST_CHANGES** 로 두고 summary_ko 에 그 사실을 적습니다
   (판정 불가를 통과로 읽지 않습니다).
6. summary_ko 에는 **수정 우선순위**를 적습니다 — p0 → p1 → p2 순으로 무엇을 먼저 고쳐야 하는지.
'''
