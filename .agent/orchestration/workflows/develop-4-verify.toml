name = "develop-4-verify"
description = """
개발 루프 4단계 — **사람이 게이트 ⑦ 이후 직접 고친 diff** 를 5축으로 재검증한다.
수정 노드가 없다. 지금 워킹트리에 있는 최종 diff 가 그대로 대상이다.

왜 필요한가. develop-3-repair·approve 는 게이트 ⑦ 에서 끝나고, 그 뒤 사람이 넣은 수정
(오탐 기각·설계 결정 반영·직접 패치)은 **어떤 축 노드도 보지 않은 채** 커밋·PR 로 나간다.
wave 2 에서 실제로 그렇게 나갔다 — 이 워크플로우가 그 구멍을 막는다.

노드 배치:
  wave 1 (6)  intent_ac_v tests_v side_effects_v deploy_v rollback_v docs_final_v   codex/terra · read-only
  wave 2 (1)  final_summary_v                                                       codex/terra · read-only
  wave 3 (1)  verify_and_draft 🚦                                                    사람

사용법 (같은 run-dir 에 이어 쓴다 — 커밋 **전에** 돌린다):
  .agent/orchestration/runner/run-graph.py .agent/orchestration/workflows/develop-4-verify.toml \\
    --run-dir .agent/orchestration/runs/UND-14 \\
    --set ticket=UND-14 \\
    --set spec_file=.agent/orchestration/runs/UND-14/spec.json \\
    --set review_file=.agent/orchestration/runs/UND-14/final_summary.json \\
    --set decisions_file=<결정 문서 경로 또는 없음> --max-parallel 6

review_file 은 **직전 라운드의 final_summary.json** 을 넘긴다 — 사람이 무엇을 기각하고
무엇을 고쳤는지 대조할 기준이 된다.

**재실행 시 주의**: `final_summary_v.json` 을 그대로 `review_file` 로 넘기지 않는다. 이 워크플로우가
같은 파일을 덮어쓰므로 노드가 읽을 시점에는 사라진다. 다시 돌릴 때는 먼저 스냅샷을 뜬다:

  cp $RUN/final_summary_v.json $RUN/final_summary_v.prev.json
  ... --set review_file=$RUN/final_summary_v.prev.json
"""
cwd = "."

