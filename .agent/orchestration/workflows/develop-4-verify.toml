   변경 이력 서술을 문서 본문에 넣지 마세요 (이력은 PR·커밋이 담당합니다).
4. 코드가 같은 모듈 안에서 다른 배포단위로 이동했다면(예: API consumer → worker) 항목을 삭제하지 말고
