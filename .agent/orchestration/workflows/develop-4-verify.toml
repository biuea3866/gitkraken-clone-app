# ── wave 2 ── 최종 verdict 확정. 재검증 6축을 병합한다.
[[nodes]]
id = "final_summary_v"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["intent_ac_v", "tests_v", "side_effects_v", "deploy_v", "rollback_v", "docs_final_v"]
output_schema = ".agent/orchestration/schemas/final-summary.json"
prompt = '''
티켓 {{ticket}} 의 **최종 상태**를 판정하세요. 코드를 수정하지 않습니다.

입력:
- 재검증 5축 산출물: 업스트림 `intent_ac_v` · `tests_v` · `side_effects_v` · `deploy_v` · `rollback_v`
- 문서 제안: 업스트림 `docs_final_v`
- 스펙: {{spec_file}} · 직전 판정: {{review_file}}
- 등급·verdict 규칙: .agent/docs/review-grading.md

해야 할 일:
1. 재검증 findings 를 중복 제거해 병합합니다 (같은 파일:라인 + 같은 원인은 1건, 최고 레벨 채택).
2. `rounds_run` 은 직전 라운드 수 + 1 입니다 (사람 수정분 재검증 라운드).
3. `remaining_blocking` 에 **최종 diff 에 남아 있는 p0~p2 만** 넣습니다. 해소된 직전 라운드 findings 는 넣지 않습니다.
4. `advisory` 에 p3~p4 를 남깁니다 (자동 수정 대상이 아니며, 사람이 판단할 몫입니다).
5. `ac_results` 를 최종 diff 기준으로 채웁니다.
6. `doc_proposals` 는 `docs_final_v` 의 proposals 개수입니다.
7. `pr_ready` 는 **remaining_blocking 이 비어 있고 · 모든 AC 가 met 이고 · 빌드/테스트가 pass** 일 때만 true 입니다.
   하나라도 불확실하면 false 로 두고 이유를 summary_ko 에 씁니다.
8. `next_steps_ko` 에는 사람이 게이트에서 할 일을 적습니다 — 남은 blocking 처리, 커밋, Draft PR 순서.
   **노드는 커밋·PR 을 수행하지 않습니다.**
9. **축 산출물**이 누락·파싱 실패면 verdict 를 REQUEST_CHANGES 로 두고 그 사실을 적습니다 (fail-closed).
   fail-closed 는 **증거인 축 산출물에만** 적용합니다 — `{{review_file}}`(직전 판정)은 메타데이터라
   읽지 못해도 그것만으로 REQUEST_CHANGES 로 만들지 않습니다. 그때는 `rounds_run` 을 0 으로 두고
   그 사실을 `summary_ko` 에 적은 뒤, **축 findings 만으로** verdict 를 정합니다.
'''


# ── wave 3 ── 게이트 — 재검증 결과를 보고 커밋·PR 로 넘어간다.
[[nodes]]
id = "verify_and_draft"
type = "gate"
needs = ["final_summary_v"]
prompt = '''
게이트 ⑧ — 사람 수정분 재검증 결과. 티켓 {{ticket}} 를 확인하세요.

