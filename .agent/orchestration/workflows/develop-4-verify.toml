  - `.agent/docs/ssot-map.md` · `README.md`

해야 할 일:
1. 변경된 심볼·경로·엔드포인트·토픽·엔티티 이름을 뽑아 **문서 전반에 grep** 합니다. 매치가 곧 후보입니다.
