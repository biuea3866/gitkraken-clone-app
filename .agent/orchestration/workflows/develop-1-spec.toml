name = "develop-1-spec"
description = """
개발 루프 1단계 — 요구사항을 스펙으로 굳힌다 (custom-develop-orchestrator 의 ①②③).
읽기 전용이며 코드를 만들지 않는다. 마지막 `approve_spec` 게이트에서 러너가 멈추고(exit 2),
사람이 스펙을 승인하면 develop-2-implement 를 실행한다.

노드 배치: evidence(claude) → spec(codex) → approve_spec(사람 게이트).
**탐색이 필요한 단계는 claude 노드가 맡고 결과를 파일로 codex 에 넘긴다.**

사용법:
  .agent/orchestration/runner/run-graph.py .agent/orchestration/workflows/develop-1-spec.toml \\
    --run-dir .agent/orchestration/runs/UND-14 \\
    --set ticket=UND-14 --set requirements_file=.claude-local/UND-14.md

**티켓 1건 = run-dir 1개**로 고정한다 (`--run-dir`). 후속 워크플로우가 같은 디렉토리에
이어 써서 한 티켓의 산출물이 한곳에 모인다. 게이트 도달 시 종료 코드는 **2** 다 —
0 만 성공으로 보는 래퍼를 쓰지 않는다.

requirements_file 에는 티켓 md 본문·논의 내용을 붙여 둔다. 헤드리스 노드는 대화 맥락을 갖지 않으므로 요구사항 정리는 사람 또는 대화형 Claude 세션이
미리 해서 파일로 넘긴다. 코드베이스 사실은 evidence 노드가 직접 조사한다.
"""
cwd = "."

# ── wave 1 ── 코드베이스 근거 수집. 파일 탐색이 필요해 claude 노드로 잡는다.
# 판단이 아니라 조회·정리 작업이라 sonnet 으로 둔다 (모델을 올리려면 model 만 바꾼다).
[[nodes]]
id = "evidence"
vendor = "claude"
model = "sonnet"
tools = ["Read", "Grep", "Glob", "Bash"]
timeout_seconds = 1200
prompt = '''
티켓 {{ticket}} 의 **코드베이스 근거**를 수집하세요. 설계·구현은 하지 않습니다.

입력: {{requirements_file}} — 먼저 읽고 다룰 개념·클래스명·화면을 파악하세요.

절차:
1. 요구사항의 핵심 키워드로 `src/` 를 grep 해 **관련 코드가 이미 있는지** 확인합니다.
   0건이어도 "부재" 로 단정하지 말고, 상위 개념으로 1회 재grep 합니다 (이름이 다를 수 있습니다).
2. 걸린 파일이 **어느 레이어**인지 기록합니다 — `domain`/`application`/`infrastructure`/`presentation`.
   요구사항이 건드릴 레이어와 실제 코드 위치가 다르면 그 사실을 명시합니다.
3. **호출 경로**를 확인합니다 — Gateway interface → 구현체 → UseCase → 화면까지 이어지는지 grep 으로 봅니다.
   중간이 끊겨 있으면 미사용 코드이므로 그 지점을 남깁니다.
4. **기존 테스트**를 찾습니다 (`src/test/` 하위 `*Spec.kt`). 관련 테스트가 이미 있으면 경로를 남깁니다.
5. **의존성 확인** — 요구사항이 새 라이브러리를 요구하면 `gradle/libs.versions.toml` 에
   이미 있는지 확인합니다. 없으면 추가가 필요하다는 사실을 남깁니다.
6. 요구사항의 전제("X 는 현재 Y 다")가 있으면 **코드로 검증**하고 참/거짓/불명으로 판정합니다.
   전제가 틀린 채 스펙이 작성되면 구현 전체가 함께 틀립니다.

추측 금지 — 읽고 확인한 것만 적고, 모든 사실에 `파일:라인` 을 붙입니다.

다음 JSON 객체 하나만 출력하세요:
{
  "queried": true,
  "existing_code": [{"path": "app/src/main/kotlin/...", "layer": "domain", "note": "..."}],
  "call_path_intact": true,
  "call_path_note": "끊긴 지점이 있으면 파일:라인",
  "existing_tests": ["app/src/test/kotlin/..."],
  "missing_dependencies": ["필요하지만 카탈로그에 없는 라이브러리"],
  "premise_checks": [{"premise": "요구사항의 전제", "verdict": "true|false|unknown", "evidence": "파일:라인"}],
  "notes_ko": "요구사항 서술과 다른 점, 조사 한계 등"
}
'''

# ── wave 2 ── 스펙 작성. 문서 작업이라 codex/terra.
[[nodes]]
id = "spec"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["evidence"]
output_schema = ".agent/orchestration/schemas/spec.json"
prompt = '''
티켓 {{ticket}} 의 구현 스펙을 작성하세요. **문서 작성 작업이며 코드를 만들지 않습니다.**

입력:
- 요구사항 원문: {{requirements_file}} — 먼저 이 파일을 읽으세요.
- **코드베이스 근거**: 업스트림 `evidence` 노드의 산출물 (기존 코드 위치·레이어·호출 경로·테스트·전제 검증).
  코드 사실은 **오직 이 파일만** 근거로 쓰고 추측하지 마세요.
  `evidence` 가 요구사항과 다른 사실을 보고했다면 **evidence 를 우선**하고, 그 불일치를 goal 에 명시하세요.
- 레이어 규칙: .agent/rules/architecture-layers.md — 새 클래스의 레이어 배치를 여기서 확인합니다.
- 코드 규칙: .agent/rules/ (JGit 자원·Compose·Kotlin 관용구·테스트) — 테스트 계획에 반영합니다.
- 프로세스 게이트: .agent/docs/conventions.md

해야 할 일:
1. 요구사항에서 목표와 인수 조건을 뽑습니다. 원문에 없는 조건을 발명하지 마세요.
2. **요구사항이 적은 파일 경로·모듈명은 "주장"으로 취급하고 반드시 검증합니다.** 티켓은 사람이나 AI 가
   작성한 것이라 모듈 귀속이 틀리는 경우가 흔합니다. 지목된 경로에서 파일을 찾지 못했다면 **거기서 멈추지 말고**
   파일명과 심볼로 프로젝트 전체를 다시 찾습니다 (예: `find . -name 'Evaluator.kt' -not -path '*/build/*'`,
   `grep -rn '<심볼>' --include='*.kt' .`). 이름이 같은 클래스가 여러 모듈에 있을 수 있으니, 인용된 줄 번호·
   어노테이션·시그니처까지 대조해 **실제 파일을 특정**하고 그 경로를 근거에 적습니다.
   전 범위를 찾아도 없을 때만 "현재 소스에 없음" 으로 open_questions 에 올립니다.
3. 영향 모듈을 코드베이스에서 **확인**합니다 — 관련 심볼·엔드포인트·토픽을 실제로 grep 해서 근거를 잡고,
   추측으로 모듈을 나열하지 마세요. 각 모듈의 요구 JVM 은 모듈 CLAUDE.md 의 스택 핀이 기준입니다.
   호출자·소비자 쪽도 함께 찾아 변경이 영향을 주는 범위를 확인합니다.
4. **원인 가설도 코드로 검증합니다.** 요구사항의 원인 분석이 맞는지 실제 어노테이션·구현을 읽고 확인하고,
   다르면 무엇이 실제 원인인지 근거와 함께 밝힙니다 (예: 물리 삭제인지 soft delete + 필터인지).
5. 테스트 계획은 레이어별로(domain/application/infrastructure/presentation) 쓰고,
   해피 패스뿐 아니라 실패·엣지 케이스를 반드시 포함합니다.
6. 사람 판단이 필요한 모호한 지점은 임의로 결정하지 말고 open_questions 에 남깁니다.
'''

# ── wave 3 ── 게이트 ③. 러너는 대기하지 못하므로 여기서 멈추고(exit 2) 재개 명령을 안내한다.
[[nodes]]
id = "approve_spec"
type = "gate"
needs = ["spec"]
prompt = '''
게이트 ③ — 구현 승인. 티켓 {{ticket}} 의 스펙을 검토하세요.

확인할 것:
1. `spec.json` 의 `open_questions` 가 **빈 배열**인가. 남아 있으면 먼저 해소하세요 —
   구현 노드는 open_questions 가 있으면 구현하지 않고 멈춥니다.
2. `acceptance_criteria` 가 요구사항과 일치하고, 검증 가능한 문장인가.
3. `modules` 의 진입 디렉토리와 요구 JVM 이 실제 코드베이스와 맞는가 (근거가 적혀 있는가).
4. `evidence.json` 의 운영 근거가 요구사항 서술과 다르면, 스펙이 evidence 를 우선했는가.

승인하면 다음을 실행합니다 (같은 run-dir 로 이어 씁니다):
  .agent/orchestration/runner/run-graph.py .agent/orchestration/workflows/develop-2-implement.toml \\
    --run-dir <이 run-dir> --set ticket={{ticket}} --set spec_file=<이 run-dir>/spec.json
'''
