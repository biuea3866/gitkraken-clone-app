prompt = '''
`tickets/` 전체를 **의존·wave 렌즈**로만 리뷰하세요. lens 는 "dependency" 로 고정합니다.
티켓 파일을 수정하지 마세요 — 지적만 합니다.

기준: tickets/README.md 의 위상정렬·파일 교집합 주장이 **실제 티켓 정의와 일치하는지** 검증합니다.

점검 항목:
1. **위상 정합** — 모든 티켓의 의존 대상이 **자기보다 앞선 wave** 에 있는지. 위반은 p1.
2. **의존 실재** — 존재하지 않는 티켓 ID 를 의존으로 적었으면 p1.
3. **파일 교집합** — 같은 wave 의 두 티켓이 **같은 소유 패키지**를 선언했으면 p1
   (Single Writer per File 위반). README 의 "교집합 ∅" 주장을 실제로 검증하세요.
4. **교차 wave 재수정 표 정합** — README 의 재수정 파일 표(`build.gradle.kts`·`App.kt`·`shell/`·`graph/`)가
   실제 티켓 소유 선언과 맞는지. 표에 없는 재수정이 있으면 p2.
5. **wave 너비 주장** — README 가 적은 너비 분포·평균이 실제 티켓 wave 배정과 일치하는지. 불일치는 p2.
6. **누락 의존** — 티켓 본문이 다른 티켓의 산출물을 명시적으로 참조(예: "UND-38 Undo 스택에 기록")하는데
   의존 목록에 그 티켓이 없으면 p1.
7. **과잉 의존** — 본문 어디에서도 쓰지 않는 티켓을 의존으로 걸었으면 p3 (wave 를 불필요하게 늦춘다).

셸로 티켓 헤더를 파싱해 직접 대조하세요. 추측 금지 — 대조 명령을 evidence 에 남깁니다.
'''

