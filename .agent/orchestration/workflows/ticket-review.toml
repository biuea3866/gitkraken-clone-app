prompt = '''
`tickets/` 의 모든 티켓 md 를 **구조 렌즈**로만 리뷰하세요. lens 는 "structure" 로 고정합니다.
티켓 파일을 수정하지 마세요 — 지적만 합니다.

기준 문서를 먼저 읽으세요:
- tickets/README.md — 티켓 md 규약 · 공통 규약 · 소유 패키지 표
- .agent/docs/review-grading.md — 등급(p0~p5) 기준
- .agent/docs/review-false-positives.md — 오탐이면 기각·강등

점검 항목:
1. **필수 섹션 존재** — `## 작업 내용 (설계 의도)` · `## 다이어그램`(처리 흐름 + 클래스 의존) · `## 테스트 케이스`.
   하나라도 없거나 내용이 placeholder 면 p2.
2. **헤더 줄 정합** — `> wave N · 사이즈 S/M/L · 의존 ... · 소유 ...` 형식이며,
   README 표의 wave·사이즈·의존·소유 패키지와 **일치**하는지 대조. 불일치는 p1.
3. **금지 항목 부재** — AC(인수 조건)·생성/수정 파일 목록이 들어 있으면 p2 (규약 위반).
4. **롤백 명시** — 파괴적 변경·상태 전이·외부 연동을 다루는 티켓에 `**롤백**:` 줄이 있는지.
   필요한데 없으면 p2, 불필요한데 있으면 p4.
5. **공통 규약 중복** — tickets/README.md 의 공통 규약(문자열 리소스·색 토큰·Undo 기록·키보드 경로·
   `use {}`)을 개별 티켓이 불필요하게 재서술하면 p4.
6. **사이즈 타당성** — 작업 내용 대비 사이즈(S~200줄/M~400줄/L~800줄)가 명백히 어긋나면 p3.

셸로 직접 세고 확인하세요. checked 의 evidence 에는 실행한 명령 또는 `파일:라인` 을 적습니다.
추측으로 지적하지 마세요.
'''

