prompt = '''
`tickets/` 의 모든 티켓 md 를 **기술 타당성 렌즈**로만 리뷰하세요. lens 는 "feasibility" 로 고정합니다.
티켓 파일을 수정하지 마세요 — 지적만 합니다.

기준 문서를 먼저 읽으세요:
- .agent/rules/architecture-layers.md · jgit-usage.md · compose-ui.md · credential-handling.md
- CLAUDE.md — 스택 전제 (Kotlin/JVM · Compose Desktop · JGit)

점검 항목:
1. **JGit 으로 실현 가능한가** — 티켓이 전제한 동작을 JGit 이 제공하는지. 외부 프로세스(`git-lfs`·GPG 등)가
   필요한데 그 사실이 티켓에 없으면 p2. **JGit 이 지원하지 않는 동작을 전제했으면 p1.**
2. **레이어 배치 타당성** — 소유 패키지가 `.agent/rules/architecture-layers.md` 의 레이어 책임과 맞는지.
   domain 에 JGit·Compose 의존이 생길 설계면 p1.
3. **자원·스레드** — Git I/O 를 다루는 티켓이 `use {}` 와 `Dispatchers.IO` 를 전제하는지.
   대형 저장소에서 UI 를 멈출 설계면 p2.
4. **자격증명 취급** — 인증을 다루는 티켓이 평문 저장·로그 노출 위험을 만들면 p0.
5. **상호 모순** — 두 티켓이 같은 대상에 **다른 설계**를 전제하면 p1
   (예: 한쪽은 Repository 를 앱 수명 동안 유지, 다른 쪽은 조회마다 재생성).
6. **미검증 단정** — 티켓 본문이 라이브러리 동작을 단정하는데 근거가 없으면 p3.
   (JGit API 실제 동작은 코드로 확인할 수 없으니 "확인 필요" 로 남기고 단정하지 마세요.)

확인 불가한 항목은 findings 가 아니라 **not_checked** 에 이유와 함께 남기세요.
'''

