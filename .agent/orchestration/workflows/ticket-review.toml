prompt = '''
`tickets/` 의 모든 티켓 md 를 **테스트 케이스 렌즈**로만 리뷰하세요. lens 는 "tests" 로 고정합니다.
티켓 파일을 수정하지 마세요 — 지적만 합니다.

기준 문서를 먼저 읽으세요:
- .agent/rules/testing.md — 테스트 규칙 (Kotest 통일 · 실제 임시 저장소 강제 · 경계값)
- .agent/docs/review-grading.md — 등급 기준
- .agent/docs/review-false-positives.md — 오탐이면 기각·강등

점검 항목:
1. **개수** — 티켓당 최소 3건. 미만이면 p2.
2. **유형 커버** — 해피 패스 / 실패·예외 / 엣지·경계값 세 유형이 **모두** 있는지.
   한 유형이 통째로 빠졌으면 p2. 해피 패스만 나열됐으면 p2.
3. **다이어그램 분기 대응** — 처리 흐름 다이어그램의 `alt`/`else` 분기마다 대응 테스트가 있는지.
   분기는 있는데 대응 케이스가 없으면 p2.
4. **Git 도메인 경계값** — Git 을 다루는 티켓에 다음 중 해당하는 경계가 빠졌으면 p3:
   빈 저장소(커밋 0건) · 커밋 1건 · 병합 커밋(부모 2개) · detached HEAD · 이진 파일.
5. **검증 가능성** — 한 문장으로 서술됐고 무엇을 확인하는지 읽히는지. 모호하면 p3.
   "정상 동작한다" 류 검증 불가 서술은 p2.
6. **자원 해제 검증** — JGit 자원을 여는 티켓에 close/해제 검증 케이스가 있는지. 없으면 p3.

각 티켓의 테스트 케이스 개수를 실제로 세어 evidence 에 남기세요.
'''

