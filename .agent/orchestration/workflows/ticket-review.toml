prompt = '''
`tickets/` 의 모든 티켓 md 를 **다이어그램 렌즈**로만 리뷰하세요. lens 는 "diagram" 으로 고정합니다.
티켓 파일을 수정하지 마세요 — 지적만 합니다.

점검 항목:
1. **개수** — 티켓마다 mermaid 블록이 정확히 2개(처리 흐름 + 클래스 의존)인지. 아니면 p2.
2. **flowchart 방향** — 클래스 의존 다이어그램이 `flowchart LR` 인지. `TB`/`TD` 는 p3.
3. **노드 수** — 다이어그램당 노드 15개 이하인지. 초과인데 `subgraph` 그룹핑이 없으면 p3.
4. **`&` 체이닝 금지** — `A --> B & C` 형태가 있으면 p3 (각 연결을 별도 라인으로).
5. **문법 유효성** — mermaid 블록이 파싱 가능한 형태인지 정적으로 점검
   (미닫힌 `subgraph`, 정의되지 않은 노드 참조, `participant` 없이 쓰인 화살표 등). 깨졌으면 p2.
6. **본문 정합** — 다이어그램에 등장하는 클래스·단계가 작업 내용 서술과 어긋나면 p3.
   본문이 언급한 핵심 협력 객체가 클래스 의존 다이어그램에 없으면 p4.
7. **레이블 안전성** — 노드 레이블에 mermaid 파서를 깨뜨리는 문자(`(`·`)`·`:` 등)가
   따옴표 없이 들어갔으면 p2.

블록 수·노드 수는 셸로 직접 세고 evidence 에 명령을 남기세요.
'''

# ── wave 2 ── 5개 렌즈 결과를 종합. 판단·서술이므로 claude/opus.

[[nodes]]
id = "synthesize"
vendor = "claude"
model = "opus"
tools = ["Read", "Grep", "Glob"]
needs = ["structure", "tests", "dependency", "feasibility", "diagram"]
timeout_seconds = 1800
prompt = '''
업스트림 5개 렌즈 노드의 산출물을 읽고 티켓 세트 전체의 verdict 를 확정하세요.

판정 기준은 .agent/docs/review-grading.md 가 정본입니다:
- p0~p2 가 하나라도 있으면 REQUEST_CHANGES
- p3~p4 만 있으면 COMMENT
- 없으면 APPROVED

산출물이 없거나 파싱 실패한 렌즈가 있으면 **fail-closed** — REQUEST_CHANGES 로 취급하고
어느 렌즈가 비었는지 명시하세요.

해야 할 일:
1. 5개 렌즈의 findings 를 모읍니다.
2. **중복 제거** — 같은 티켓·같은 문제를 두 렌즈가 지적했으면 하나로 합치고 더 높은 등급을 남깁니다.
3. **오탐 필터** — .agent/docs/review-false-positives.md 와 대조해 해당하면 기각하거나 강등하고,
   기각한 항목은 rejected 에 사유와 함께 남깁니다.
4. **근거 검증** — finding 이 지목한 `파일:라인` 을 실제로 Read 해 확인합니다.
   확인되지 않으면 기각합니다 (추측성 지적 차단).
5. 티켓별로 묶어 정리합니다.

다음 JSON 객체 하나만 출력하세요:
{
  "verdict": "APPROVED" | "COMMENT" | "REQUEST_CHANGES",
  "counts": { "p0": 0, "p1": 0, "p2": 0, "p3": 0, "p4": 0 },
  "lenses_reported": ["structure", "..."],
  "lenses_missing": [],
  "findings": [
    { "level": "p1", "ticket": "UND-14", "file": "...", "line": 0,
      "problem": "...", "fix": "...", "lenses": ["structure"], "verified": true }
  ],
  "rejected": [ { "ticket": "...", "problem": "...", "reason_ko": "기각·강등 사유" } ],
  "top_actions_ko": ["가장 먼저 고쳐야 할 것 3~5개"],
  "summary_ko": "티켓 세트 전체 상태 3~5문장"
}

규칙:
- 근거를 확인하지 못한 finding 은 findings 가 아니라 rejected 로 보냅니다.
- p3~p4 는 보고만 하고 자동 수정 대상으로 표시하지 않습니다.
- 티켓 파일을 수정하지 마세요.
'''
