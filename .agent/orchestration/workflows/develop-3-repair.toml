name = "develop-3-repair"
description = """
개발 루프 3단계 (REQUEST_CHANGES 분기) — p0~p2 수정 → 2차 6축 병렬 재검증 → 최종 요약 → 사람 게이트.
`review_summary_1.json` 의 verdict 가 REQUEST_CHANGES 일 때만 **메인 Claude 가** 이 워크플로우를 고른다
(러너에는 조건부 분기가 없다). APPROVED·COMMENT 면 develop-3-approve.toml 로 간다.

노드 배치:
  wave 1 (1)  repair_and_verify_2                            claude/opus  · workspace-write
  wave 2 (6)  intent_ac_2 tests_2 side_effects_2 deploy_2 rollback_2 docs_final_2   codex/terra · read-only
  wave 3 (1)  final_summary                                  codex/terra  · read-only
  wave 4 (1)  review_and_draft 🚦                            사람

쓰기 노드는 wave 1 에 단독이다. 2차 검증은 **최종 diff** 를 대상으로 같은 5축을 다시 돌리고,
문서 드리프트(docs_final_2)도 중간 상태가 아니라 최종 diff 만 본다.

사용법 (develop-2-implement 와 같은 run-dir 에 이어 쓴다):
  .agent/orchestration/runner/run-graph.py .agent/orchestration/workflows/develop-3-repair.toml \\
    --run-dir .agent/orchestration/runs/UND-14 \\
    --set ticket=UND-14 \\
    --set spec_file=.agent/orchestration/runs/UND-14/spec.json \\
    --set review_file=.agent/orchestration/runs/UND-14/review_summary_1.json \\
    --max-parallel 6
"""
cwd = "."

# ── wave 1 ── p0~p2 수정 + 재빌드·재테스트. 판단이 필요하므로 claude/opus.
[[nodes]]
id = "repair_and_verify_2"
vendor = "claude"
model = "opus"
tools = ["Read", "Write", "Edit", "Bash", "Grep", "Glob"]
permission_mode = "acceptEdits"
timeout_seconds = 3600
prompt = '''
티켓 {{ticket}} 의 1차 검증에서 지적된 **p0~p2 를 수정**하고 재검증하세요. **코드 작성 작업입니다.**

입력:
- 1차 리뷰 결과: {{review_file}} — findings 와 summary_ko 의 수정 우선순위를 따릅니다.
- 스펙: {{spec_file}}
- **결정 문서: {{decisions_file}}** — 스펙 밖에서 사람이 확정한 결정과 **앞선 결정의 정정**이 들어 있다.
  결정 문서의 `정정` 절은 이전 서술을 **덮어쓴다** — 구현이 옛 결정을 따르고 있으면 정정 쪽으로 고친다.
  값이 `없음` 이면 결정 문서가 없다는 뜻이다. — 인수 조건은 여전히 이것이 기준입니다.
- 코드 규칙: .agent/rules/ · 등급 기준: .agent/docs/review-grading.md

절차:
1. findings 를 레벨 순(p0 → p1 → p2)으로 처리합니다.
2. **p3~p4 는 고치지 않습니다.** 최종 보고에 남을 뿐이며, 손대면 스코프가 번집니다.
   고치지 않은 이유를 따로 적을 필요도 없습니다 (등급 규칙상 자동 수정 대상이 아님).
3. 수정에 동의하지 않는 finding 이 있으면 **고치지 말고** `disputed` 에 근거(파일:라인)와 함께 남깁니다.
   틀린 지적을 억지로 반영하면 코드가 나빠집니다.
4. 수정 후 모듈 디렉토리에서 빌드·테스트를 **다시** 돌립니다.
   `export JAVA_HOME=$(/usr/libexec/java_home -v <모듈 요구 버전>)` 선행 (훅이 불일치 시 차단).
5. 실패하면 스스로 고쳐 통과할 때까지 반복합니다.
6. **커밋하지 않습니다.** `git push` · mainline 머지 · 시크릿 편집 금지.

최종 응답은 다음 JSON 객체 하나만 출력하세요:
{
  "ticket": "{{ticket}}",
  "status": "repaired" | "partially_repaired",
  "fixed": [{"level": "p0", "file": "경로", "line": 0, "how": "무엇을 어떻게 고쳤는지"}],
  "disputed": [{"level": "p1", "file": "경로", "line": 0, "why_ko": "왜 지적이 틀렸는지 근거"}],
  "files_changed": ["경로", ...],
  "build": [{"module": "app", "command": "./gradlew test", "result": "pass" | "fail", "note": "..."}],
  "summary_ko": "한 문장 요약"
}
'''

# ── wave 2 ── 2차 6축 병렬 재검증. 최종 diff 기준. 전부 읽기 전용 codex/terra.
#
# 1차와 같은 축 정의를 쓴다 (role_file = custom-self-code-review). 다른 점은 대상이 **최종 diff** 이고,
# 1차 findings 가 실제로 해소됐는지 함께 확인한다는 것이다.

[[nodes]]
id = "intent_ac_2"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["repair_and_verify_2"]
role_file = ".agent/skills/custom-self-code-review/SKILL.md"
output_schema = ".agent/orchestration/schemas/axis-review.json"
prompt = '''
티켓 {{ticket}} 의 **최종 diff** 를 **축 1 (변경 의도와 티켓 정합성) 만** 재검증하세요.
코드를 수정하지 않습니다. axis 는 "intent_ac" 로 고정합니다.

입력:
- 스펙: {{spec_file}} · 1차 리뷰: {{review_file}}
- 수정 보고: 업스트림 `repair_and_verify_2` 산출물 (fixed · disputed).
- 최종 변경: `git status --porcelain` · `git diff` — **중간 상태가 아니라 지금의 diff** 가 대상입니다.
- 등급 기준: .agent/docs/review-grading.md · 오탐 기준: .agent/docs/review-false-positives.md (선행 대조)

**같은 원인의 변형을 전부 찾아 한 번에 보고하세요.** finding 하나를 적었으면 그 원인이 만드는
**다른 입력·다른 경로**를 스스로 뒤져 같은 finding 에 묶습니다 — 한 라운드에 하나씩만 내면 수정·재검증이
그 횟수만큼 반복되고, 그 사이 사람이 "고쳤다" 고 판단합니다.
(실제 사례: `schemaVersion` 해석 실패 하나가 Int 절삭 → Double 폴백 → 명시적 null 로 세 라운드에 나뉘어
나왔습니다. 셋은 같은 결함이며 한 번에 나왔어야 합니다.)

**단, 넓히는 범위는 이번 diff 가 원인인 것까지입니다.** 같은 부류를 이 diff 밖 기존 코드로 넓혀
차단하지 마세요 — 그것이 라운드를 끝나지 않게 만든 실제 원인입니다. 차단(`findings`)에 올릴 자격은
`.agent/docs/review-grading.md` "차단 판정의 전제 — diff 인과성" 의 C1~C6 이 정합니다. 자격이
없으면 **심각도를 낮추지 말고 `advisory` 에 `non_blocking_reason` 과 함께** 넣고, 필요하면
`followup_ko` 에 후속 티켓 내용을 적습니다.

점검:
1. 1차의 축 1 findings 가 실제로 해소됐는지 파일:라인으로 확인합니다. 미해소면 그대로 다시 올립니다.
2. `disputed` 항목은 근거를 읽고 **타당하면 기각**, 부당하면 유지합니다 (판단과 근거를 checked 에 남깁니다).
3. 수정 과정에서 **스코프가 번지지 않았는지** 봅니다 — p3~p4 를 손대거나 무관 리팩터링이 들어왔으면 지적합니다.
4. 인수 조건 대조를 최종 diff 기준으로 다시 합니다.
'''

