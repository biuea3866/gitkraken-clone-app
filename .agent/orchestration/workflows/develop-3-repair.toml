id = "review_and_draft"
type = "gate"
needs = ["final_summary"]
prompt = '''
게이트 ⑦ — 최종 검토. 티켓 {{ticket}} 의 결과를 확인하세요.

확인할 것:
1. `final_summary.json` 의 `pr_ready` 가 true 인가. `remaining_blocking` 이 비어 있는가.
2. `advisory` (p3~p4) 중 지금 고칠 것이 있는가 — 자동 수정되지 않았습니다.
3. `repair_and_verify_2.json` 의 `disputed` 항목에 동의하는가 (틀린 지적을 기각한 근거가 타당한가).
4. `docs_final_2.json` 의 문서 제안을 반영할 것인가 — **노드는 문서를 수정하지 않았습니다.**
5. `git diff` 로 최종 변경을 직접 확인했는가.

승인 후 사람이 수행합니다 (노드가 하지 않습니다):
  - 문서 제안 반영
  - 커밋 (`[{{ticket}}] - <type>: <제목>` 형식)
  - Draft PR (`/custom-pr-create`)
'''
