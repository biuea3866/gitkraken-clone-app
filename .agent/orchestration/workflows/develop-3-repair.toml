**다른 입력·다른 경로**를 스스로 뒤져 같은 finding 에 묶습니다 — 한 라운드에 하나씩만 내면 수정·재검증이
그 횟수만큼 반복되고, 그 사이 사람이 "고쳤다" 고 판단합니다.
(실제 사례: `schemaVersion` 해석 실패 하나가 Int 절삭 → Double 폴백 → 명시적 null 로 세 라운드에 나뉘어
나왔습니다. 셋은 같은 결함이며 한 번에 나왔어야 합니다.)

**단, 넓히는 범위는 이번 diff 가 원인인 것까지입니다.** 같은 부류를 이 diff 밖 기존 코드로 넓혀
차단하지 마세요 — 그것이 라운드를 끝나지 않게 만든 실제 원인입니다. 차단(`findings`)에 올릴 자격은
`.agent/docs/review-grading.md` "차단 판정의 전제 — diff 인과성" 의 C1~C6 이 정합니다. 자격이
없으면 **심각도를 낮추지 말고 `advisory` 에 `non_blocking_reason` 과 함께** 넣고, 필요하면
`followup_ko` 에 후속 티켓 내용을 적습니다.

점검:
1. 1차의 축 5 findings 해소 여부를 확인합니다 (특히 설정 역방향 호환·파괴적 연산 가드).
2. **수정이 롤백 경로를 깨뜨렸는지** — 되돌릴 수 없는 상태 전이나 데이터 해석 불가 경로가 새로 생겼는지 봅니다.
3. 설정 스키마 역방향 호환을 최종 상태로 확인합니다.
4. 롤백 시 데이터 유실 경로가 있으면 p0 후보로 올립니다.
'''

[[nodes]]
id = "docs_final_2"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["repair_and_verify_2"]
output_schema = ".agent/orchestration/schemas/doc-drift.json"
prompt = '''
티켓 {{ticket}} 의 **최종 diff** 가 문서 드리프트를 만드는지 점검하세요.
**문서 작성 작업이며 파일을 수정하지 않습니다 — 제안만 냅니다.**

입력:
- 최종 변경: `git status --porcelain` 과 `git diff` — **중간 상태가 아니라 지금의 diff** 만 대상입니다.
  (수정 전 상태를 근거로 제안하면 이미 해소된 드리프트를 다시 올리게 됩니다.)
- 점검 대상 문서:
  - `docs/design/*.md` — 설계 문서
  - `tickets/UND-*.md` — 티켓 정의
  - `.agent/docs/ssot-map.md` · `README.md`

해야 할 일:
1. 변경된 심볼·경로·엔드포인트·토픽·엔티티 이름을 뽑아 **문서 전반에 grep** 합니다. 매치가 곧 후보입니다.
2. 특히 Gateway 계약·화면 진입점·설정 스키마가 추가/제거/이동됐다면 해당 문서를 반드시 확인합니다.
3. 제안 서술은 **최종 상태만** 기술합니다. `~로 이관됨`·`UND-NN 이후`·`더 이상 ~하지 않음` 같은
   변경 이력 서술을 문서 본문에 넣지 마세요 (이력은 PR·커밋이 담당합니다).
4. 코드가 같은 모듈 안에서 다른 배포단위로 이동했다면(예: API consumer → worker) 항목을 삭제하지 말고
   **어느 컴포넌트가 수행하는지**를 갱신하는 제안을 냅니다. 모듈이 그 동작을 전혀 안 하게 된 경우에만 삭제입니다.
5. 갱신 대상이 없으면 drift_found=false 로 두고 근거를 summary_ko 에 씁니다 (grep 했는데 매치 없음 등).
6. 개인 memory(`~/.claude/projects/**/memory`)는 점검 대상이 아닙니다 — 레포 밖 개인 자산입니다.
'''

# ── wave 3 ── 최종 verdict 확정. 2차 6축을 병합한다.
[[nodes]]
id = "final_summary"
vendor = "codex"
model = "gpt-5.6-terra"
sandbox = "read-only"
needs = ["intent_ac_2", "tests_2", "side_effects_2", "deploy_2", "rollback_2", "docs_final_2"]
output_schema = ".agent/orchestration/schemas/final-summary.json"
prompt = '''
티켓 {{ticket}} 의 **최종 상태**를 판정하세요. 코드를 수정하지 않습니다.

입력:
- 2차 5축 산출물: 업스트림 `intent_ac_2` · `tests_2` · `side_effects_2` · `deploy_2` · `rollback_2`
- 문서 제안: 업스트림 `docs_final_2`
- 스펙: {{spec_file}} · 1차 리뷰: {{review_file}}
- 등급·verdict·차단 자격(C1~C6) 규칙: .agent/docs/review-grading.md
- **결정 문서: {{decisions_file}}** — 여기서 정해진 것은 finding 이 아닙니다 (C4).

해야 할 일:
1. 2차 findings 를 중복 제거해 병합합니다 (같은 파일:라인 + 같은 원인은 1건, 최고 레벨 채택).
2. `rounds_run` 은 2 입니다.
3. **차단 자격을 재심사합니다 (백스톱).** 축이 `findings` 에 올렸더라도
   `.agent/docs/review-grading.md` "차단 판정의 전제" C1~C6 을 못 갖춘 항목은 여기서 `advisory` 로
   옮깁니다 — verdict 를 정하는 것이 이 노드이므로 경계도 여기서 확정합니다. 근거 라인이
   **이번 diff 의 변경 라인**인지 확인하고, 변경되지 않은 라인만 인용됐으면 C1 입니다.
4. `remaining_blocking` 에 **차단 자격을 갖춘 p0~p2 만** 넣습니다. 해소된 1차 findings 는 넣지 않습니다.
5. `advisory` 에 (a) p3~p4 nit 과 (b) 3번에서 강등한 항목을 넣습니다. 강등 항목은 **심각도를 낮추지 말고**
   `non_blocking_reason`(C1~C6)을 붙이고, C1·C2 면 `followup_ko` 에 후속 티켓 내용을 적습니다.
6. **수렴을 확인합니다.** 1차보다 차단이 늘었다면 늘어난 항목이 **수정이 만든 회귀**인지 변경 라인으로
   확인합니다. 회귀가 아니면 3번으로 돌아가 강등합니다.
7. `ac_results` 를 최종 diff 기준으로 채웁니다.
8. `doc_proposals` 는 `docs_final_2` 의 proposals 개수입니다.
9. `pr_ready` 는 **remaining_blocking 이 비어 있고 · 모든 AC 가 met 이고 · 빌드/테스트가 pass** 일 때만 true 입니다.
   하나라도 불확실하면 false 로 두고 이유를 summary_ko 에 씁니다.
10. `next_steps_ko` 에는 사람이 게이트에서 할 일을 적습니다 — 문서 제안 반영, 커밋, Draft PR 순서.
   **노드는 커밋·PR 을 수행하지 않습니다.**
11. 축 산출물이 누락·파싱 실패면 verdict 를 REQUEST_CHANGES 로 두고 그 사실을 적습니다 (fail-closed).
'''

# ── wave 4 ── 게이트 ⑦. 사람이 검토한 뒤에만 문서 반영·커밋·Draft PR.
