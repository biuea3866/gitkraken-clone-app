# JDK 핀 SSOT — custom-gradlew-jvm-guard.sh 훅이 이 키를 읽어 $JAVA_HOME 과 비교한다.
# app/build.gradle.kts 의 jvmToolchain 도 이 값을 읽는다. 툴체인을 올릴 때 여기 한 곳만 고친다.
undine.jvm=21

# 배포 버전 SSOT — app/build.gradle.kts 의 nativeDistributions 와 생성되는 BuildInfo 가 이 값을 읽는다.
# /custom-release-tagger 가 만드는 태그(vX.Y.Z)와 같은 값이어야 한다.
undine.version=1.0.0

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
